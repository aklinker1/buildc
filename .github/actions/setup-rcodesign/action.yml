name: Setup rcodesign
description: Install rcodesign (apple-codesign) for signing and notarizing macOS binaries from Linux.

runs:
  using: "composite"
  steps:
    - name: Install rcodesign
      shell: bash
      run: |
        set -euo pipefail
        version=0.29.0
        asset="apple-codesign-${version}-x86_64-unknown-linux-musl"
        curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${version}/${asset}.tar.gz" -o "$RUNNER_TEMP/rcodesign.tar.gz"
        echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/${asset}/rcodesign" /usr/local/bin/rcodesign
        rcodesign --version
