[package]
name = "aklinker1_buildc"
version = "2.0.0"
edition = "2021"
# For std::fs::File::lock
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3.1"
md5 = "0.7.0"
fs_extra = "1.3.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
